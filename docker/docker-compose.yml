version: "3.9"

networks:
  kv-network:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:

x-kv-node: &kv-node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  networks:
    - kv-network
  restart: unless-stopped

services:
  node-1:
    <<: *kv-node
    container_name: node-1
    ports:
      - "8081:8081"
    environment:
      NODE_ID: node-1
      NODE_PORT: "8081"
      PRIMARY_HOST: node-1
      PEER_NODES: "node-1:8081,node-2:8082,node-3:8083,node-4:8084,node-5:8085"
      REPLICATION_FACTOR: "3"
      DATA_DIR: /data
    volumes:
      - node1-data:/data

  node-2:
    <<: *kv-node
    container_name: node-2
    ports:
      - "8082:8082"
    environment:
      NODE_ID: node-2
      NODE_PORT: "8082"
      PRIMARY_HOST: node-1
      PEER_NODES: "node-1:8081,node-2:8082,node-3:8083,node-4:8084,node-5:8085"
      REPLICATION_FACTOR: "3"
      DATA_DIR: /data
    volumes:
      - node2-data:/data

  node-3:
    <<: *kv-node
    container_name: node-3
    ports:
      - "8083:8083"
    environment:
      NODE_ID: node-3
      NODE_PORT: "8083"
      PRIMARY_HOST: node-1
      PEER_NODES: "node-1:8081,node-2:8082,node-3:8083,node-4:8084,node-5:8085"
      REPLICATION_FACTOR: "3"
      DATA_DIR: /data
    volumes:
      - node3-data:/data

  node-4:
    <<: *kv-node
    container_name: node-4
    ports:
      - "8084:8084"
    environment:
      NODE_ID: node-4
      NODE_PORT: "8084"
      PRIMARY_HOST: node-1
      PEER_NODES: "node-1:8081,node-2:8082,node-3:8083,node-4:8084,node-5:8085"
      REPLICATION_FACTOR: "3"
      DATA_DIR: /data
    volumes:
      - node4-data:/data

  node-5:
    <<: *kv-node
    container_name: node-5
    ports:
      - "8085:8085"
    environment:
      NODE_ID: node-5
      NODE_PORT: "8085"
      PRIMARY_HOST: node-1
      PEER_NODES: "node-1:8081,node-2:8082,node-3:8083,node-4:8084,node-5:8085"
      REPLICATION_FACTOR: "3"
      DATA_DIR: /data
    volumes:
      - node5-data:/data
